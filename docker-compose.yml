services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: financas
      POSTGRES_PASSWORD: financas
      POSTGRES_DB: financas
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U financas']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
